<!DOCTYPE html>
<html lang="en">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sign in · LuminaHQ</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --surface: #0f172a;
      --surface-light: #ffffff;
      --surface-muted: #f8fafc;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --text: #0f172a;
      --text-muted: #475569;
      --border: rgba(15, 23, 42, 0.08);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: linear-gradient(145deg, #e2e8f0, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(420px, calc(100% - 2.5rem));
      background: var(--surface-light);
      border-radius: 24px;
      padding: 2.75rem 2.5rem;
      box-shadow: 0 40px 120px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.15);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.85rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    p.subtitle {
      margin: 0 0 2rem;
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: rgba(37, 99, 235, 0.6);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button[type="submit"] {
      width: 100%;
      border-radius: 14px;
      border: none;
      padding: 0.85rem 1rem;
      font-weight: 600;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button[type="submit"]:disabled {
      opacity: 0.65;
      cursor: progress;
    }

    button[type="submit"]:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.25);
    }

    .status {
      margin-top: 1.5rem;
      min-height: 1.5rem;
      font-size: 0.95rem;
    }

    .status.error {
      color: var(--danger);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #fff;
      display: inline-block;
      margin-right: 0.6rem;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card" id="login-card">
    <header>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to access your LuminaHQ workspace.</p>
    </header>

    <form id="login-form" autocomplete="off">
      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="input-group" style="margin-top:1.25rem;">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="login-submit" style="margin-top:2rem;">Sign in</button>
    </form>

    <div class="status" id="status" role="alert"></div>
  </main>

  <template id="loading-template">
    <div class="status">
      <span class="spinner"></span>
      <span>Validating your session…</span>
    </div>
  </template>

  <script>
    const BASE_URL = <?!= JSON.stringify(baseUrl || '') ?>;
    const COOKIE_NAME = <?!= JSON.stringify(cookieName) ?>;
    const TOKEN_TTL_MINUTES = <?!= tokenTtlMinutes ?>;

    const selectors = {
      form: document.getElementById('login-form'),
      submit: document.getElementById('login-submit'),
      status: document.getElementById('status'),
      email: document.getElementById('email'),
      password: document.getElementById('password'),
      card: document.getElementById('login-card')
    };

    const storage = window.localStorage || null;

    function setStatus(message, variant) {
      selectors.status.textContent = message || '';
      selectors.status.classList.toggle('error', variant === 'error');
    }

    function setLoading(isLoading, message) {
      selectors.submit.disabled = isLoading;
      selectors.submit.textContent = isLoading ? 'Signing in…' : 'Sign in';
      if (isLoading) {
        setStatus(message || 'Signing you in…');
      }
    }

    function buildCookie(value, expiresAtIso) {
      const expiry = new Date(expiresAtIso);
      const attributes = [
        `${COOKIE_NAME}=${value}`,
        'path=/',
        `expires=${expiry.toUTCString()}`,
        'SameSite=None',
        'Secure'
      ];
      document.cookie = attributes.join('; ');
    }

    function removeCookie() {
      document.cookie = `${COOKIE_NAME}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=None; Secure`;
    }

    function getCookie() {
      const cookies = document.cookie.split(';').map(part => part.trim());
      for (const cookie of cookies) {
        if (!cookie) continue;
        const [key, ...rest] = cookie.split('=');
        if (key === COOKIE_NAME) {
          return rest.join('=');
        }
      }
      return '';
    }

    function redirectToDashboard() {
      const target = BASE_URL ? `${BASE_URL}?page=dashboard` : '?page=dashboard';
      if (google.script && google.script.host && typeof google.script.host.setLocation === 'function') {
        google.script.host.setLocation(target);
      } else {
        window.location.href = target;
      }
    }

    function persistSession(user, expiresAt, token) {
      if (!storage) return;
      try {
        storage.setItem('lumina.session', JSON.stringify({ user, expiresAt, token, updatedAt: new Date().toISOString() }));
      } catch (error) {
        console.warn('Unable to cache session payload', error);
      }
    }

    function clearPersistedSession() {
      if (!storage) return;
      try {
        storage.removeItem('lumina.session');
      } catch (error) {
        console.warn('Unable to clear cached session payload', error);
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      setLoading(true);
      setStatus('Authenticating…');

      const email = selectors.email.value.trim();
      const password = selectors.password.value;

      google.script.run
        .withSuccessHandler(response => {
          if (!response || !response.success) {
            setLoading(false);
            setStatus((response && response.message) || 'Unable to sign in.', 'error');
            removeCookie();
            clearPersistedSession();
            return;
          }

          buildCookie(response.token, response.expiresAt);
          persistSession(response.user, response.expiresAt, response.token);
          setStatus('Redirecting…');
          redirectToDashboard();
        })
        .withFailureHandler(error => {
          console.error('loginUser failed', error);
          setLoading(false);
          setStatus('Sign in failed. Please try again.', 'error');
        })
        .loginUser(email, password);
    }

    function validateExistingSession(token) {
      const loadingNode = document.getElementById('loading-template').content.cloneNode(true);
      selectors.status.innerHTML = '';
      selectors.status.appendChild(loadingNode);

      google.script.run
        .withSuccessHandler(result => {
          selectors.status.innerHTML = '';
          if (result && result.valid) {
            persistSession(result.user, result.expiresAt, token);
            redirectToDashboard();
            return;
          }
          removeCookie();
          clearPersistedSession();
          setStatus('Session expired. Please sign in again.');
        })
        .withFailureHandler(error => {
          console.error('validateToken failed', error);
          removeCookie();
          clearPersistedSession();
          setStatus('Session check failed. Please sign in.');
        })
        .validateToken(token);
    }

    selectors.form.addEventListener('submit', handleLogin);

    window.addEventListener('pageshow', event => {
      if (event.persisted) {
        selectors.password.value = '';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      selectors.email.focus();
      const existingToken = getCookie();
      if (existingToken) {
        validateExistingSession(existingToken);
      } else {
        setStatus('Use your LuminaHQ credentials to continue.');
      }
    });
  </script>
</body>

</html>
