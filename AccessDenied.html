<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - VLBPO LuminaHQ</title>
    <?!= includeOnce('layoutLoader') ?>
    <?!= includeOnce('layoutAlerts') ?>
    <?!= includeOnce('ResponsiveStyles') ?>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dr8qd3xfc/image/upload/v1754763514/vlbpo/lumina/3_dgitcx.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #66cbea 0%, #66cabe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            margin: 2rem;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
        }

        .error-icon {
            font-size: 4rem;
            color: #e74c3c;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .error-code {
            background: #e74c3c;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

    .reason-heading {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.75rem;
        }

        .reason-code {
            display: inline-block;
            background: rgba(231, 76, 60, 0.12);
            color: #c0392b;
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
        }

        .message {
            font-size: 1.1rem;
            color: #4f5d75;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .detail-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .detail-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
            color: #5f6c7b;
        }

        .detail-list li::before {
            content: '\2022';
            position: absolute;
            left: 0.25rem;
            color: #1d72b8;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #669fea 0%, #678bec 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #66c2ea;
            border: 2px solid #3f9efb;
        }

        .btn-secondary:hover {
            background: #66b7ea;
            color: white;
            transform: translateY(-2px);
        }

        .btn i {
            font-size: 0.95rem;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 1.25rem;
            margin: 1.5rem 0;
            border-radius: 0 8px 8px 0;
            text-align: left;
        }

        .info-box h3 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .info-box p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin: 0;
        }

        .support-note {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #5f6c7b;
        }

        .support-note a {
            color: #1d72b8;
            text-decoration: none;
            font-weight: 600;
        }

        .support-note a:hover {
            text-decoration: underline;
        }

        .technical-details {
            margin-top: 1.5rem;
            text-align: left;
        }

        .technical-details summary {
            cursor: pointer;
            font-weight: 600;
            color: #344563;
        }

        .technical-details pre {
            margin-top: 0.75rem;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.85rem;
            color: #475569;
            overflow-x: auto;
        }

        @media (max-width: 600px) {
            .container {
                margin: 1rem;
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-icon">🚫</div>
    <h1>Access Denied</h1>
    <div class="error-code">Error 403</div>
    <div class="reason-code"><?= reasonCode || 'ACCESS_DENIED' ?></div>
    <div class="reason-heading"><?= reasonHeading || 'Access denied' ?></div>

    <p class="message"><?= message || 'You do not have permission to view this page.' ?></p>

    <? if (reasons && reasons.length) { ?>
    <div class="info-box">
        <h3>🔐 Why am I seeing this?</h3>
        <ul class="detail-list">
            <? for (var i = 0; i < reasons.length; i++) { ?>
                <li><?= reasons[i] ?></li>
            <? } ?>
        </ul>
    </div>
    <? } ?>

    <? if (suggestions && suggestions.length) { ?>
    <div class="info-box">
        <h3>✅ What you can do</h3>
        <ul class="detail-list">
            <? for (var j = 0; j < suggestions.length; j++) { ?>
                <li><?= suggestions[j] ?></li>
            <? } ?>
        </ul>
    </div>
    <? } ?>

    <div class="actions">
        <? if (actions && actions.length) { ?>
            <? for (var k = 0; k < actions.length; k++) { var action = actions[k]; ?>
                <? if (action.type === 'link') { ?>
                    <a href="<?= action.href || '#' ?>" class="btn <?= action.variant === 'secondary' ? 'btn-secondary' : 'btn-primary' ?>"<? if (action.target) { ?> target="<?= action.target ?>"<? } ?><? if (action.rel) { ?> rel="<?= action.rel ?>"<? } ?>>
                        <? if (action.icon) { ?><i class="fa <?= action.icon ?>"></i><? } ?><?= action.label ?>
                    </a>
                <? } else { ?>
                    <button class="btn <?= action.variant === 'secondary' ? 'btn-secondary' : 'btn-primary' ?>" onclick="<?= action.onClick || 'history.back()' ?>">
                        <? if (action.icon) { ?><i class="fa <?= action.icon ?>"></i><? } ?><?= action.label ?>
                    </button>
                <? } ?>
            <? } ?>
        <? } ?>
    </div>

    <? if (supportEmail) { ?>
    <p class="support-note">Need help? Email <a href="mailto:<?= supportEmail ?>"><?= supportEmail ?></a>.</p>
    <? } ?>

    <? if (showTrace && trace && trace.length) { ?>
    <details class="technical-details">
        <summary>Technical details</summary>
        <pre><? for (var t = 0; t < trace.length; t++) { ?><?= trace[t] ?><? if (t < trace.length - 1) { ?>&#10;<? } ?><? } ?></pre>
    </details>
    <? } ?>
</div>

<script>
    // Add some interactive feedback
    document.addEventListener('DOMContentLoaded', function() {
        const dashboardUrl = <?= JSON.stringify(dashboardUrl || '') ?>;
        // Auto-redirect after 30 seconds if user takes no action
        setTimeout(function() {
            const shouldRedirect = confirm('Would you like to return to the dashboard?');
            if (shouldRedirect && dashboardUrl) {
                window.location.href = dashboardUrl;
            }
        }, 30000);
    });
</script>
</body>
</html>
