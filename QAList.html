<style>
    :root {
        /* Brand Color Palette */
        --navy-primary: #003177;
        --cyan-accent: #00BFFF;
        --gold-highlight: #FFB800;
        --fire-red: #FF4000;
        
        /* Modern UI Colors */
        --primary-gradient: linear-gradient(135deg, var(--navy-primary) 0%, #004ba0 100%);
        --accent-gradient: linear-gradient(135deg, var(--cyan-accent) 0%, #0099cc 100%);
        --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
        --warning-gradient: linear-gradient(135deg, var(--gold-highlight) 0%, #d97706 100%);
        --danger-gradient: linear-gradient(135deg, var(--fire-red) 0%, #dc2626 100%);
        --surface-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        
        /* UI Properties */
        --card-shadow: 0 10px 30px rgba(0,0,0,0.1);
        --card-shadow-hover: 0 20px 60px rgba(0,0,0,0.15);
        --border-radius-lg: 16px;
        --border-radius-xl: 24px;
        --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --border-color: #e2e8f0;
    }

    body {
        background: var(--surface-gradient);
        font-family: "Google Sans", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-primary);
        line-height: 1.6;
    }

    /* Modern Page Header */
    .modern-page-header {
        background: var(--primary-gradient);
        border-radius: var(--border-radius-xl);
        padding: 2rem;
        margin-bottom: 2rem;
        color: white;
        position: relative;
        overflow: hidden;
    }

    .modern-page-header::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 200px;
        height: 200px;
        background: rgba(0, 191, 255, 0.1);
        border-radius: 50%;
        transform: translate(50%, -50%);
    }

    .modern-page-header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0;
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .modern-page-header p {
        font-size: 1.1rem;
        opacity: 0.9;
        margin: 0.5rem 0 0 0;
        position: relative;
        z-index: 2;
    }

    .header-actions {
        position: absolute;
        top: 2rem;
        right: 2rem;
        z-index: 3;
    }

    /* Modern Main Card */
    .modern-main-card {
        background: white;
        border-radius: var(--border-radius-xl);
        box-shadow: var(--card-shadow);
        border: 1px solid rgba(255,255,255,0.2);
        overflow: hidden;
        transition: var(--transition-smooth);
    }

    .modern-main-card:hover {
        box-shadow: var(--card-shadow-hover);
    }

    /* Modern Controls Section */
    .controls-section {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        padding: 2rem;
        border-bottom: 1px solid var(--border-color);
    }

    .search-container {
        position: relative;
        max-width: 400px;
    }

    .search-container input {
        width: 100%;
        padding: 1rem 1rem 1rem 3rem;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        font-size: 1rem;
        transition: var(--transition-smooth);
        background: white;
    }

    .search-container input:focus {
        border-color: var(--cyan-accent);
        box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.1);
        outline: none;
        transform: translateY(-2px);
    }

    .search-container .search-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 1.1rem;
    }

    /* Modern Buttons */
    .modern-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 1.5rem;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        transition: var(--transition-smooth);
        position: relative;
        overflow: hidden;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .modern-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
    }

    .modern-btn:hover::before {
        left: 100%;
    }

    .modern-btn-primary {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 4px 15px rgba(0, 49, 119, 0.3);
    }

    .modern-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 49, 119, 0.4);
        color: white;
    }

    .modern-btn-info {
        background: var(--accent-gradient);
        color: white;
        box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3);
    }

    .modern-btn-info:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 191, 255, 0.4);
        color: white;
    }

    .modern-btn-warning {
        background: var(--warning-gradient);
        color: white;
        box-shadow: 0 4px 15px rgba(255, 184, 0, 0.3);
    }

    .modern-btn-warning:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 184, 0, 0.4);
        color: white;
    }

    .modern-btn-danger {
        background: var(--danger-gradient);
        color: white;
        box-shadow: 0 4px 15px rgba(255, 64, 0, 0.3);
    }

    .modern-btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 64, 0, 0.4);
        color: white;
    }

    .modern-btn-sm {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
    }

    /* Modern Table */
    .table-container {
        padding: 2rem;
        overflow-x: auto;
    }

    .modern-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .modern-table thead {
        background: var(--primary-gradient);
        color: white;
    }

    .modern-table th {
        padding: 1.25rem 1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 0.8rem;
        border: none;
    }

    .modern-table td {
        padding: 1rem;
        border: none;
        border-bottom: 1px solid #f1f5f9;
        font-size: 0.9rem;
        vertical-align: middle;
    }

    .modern-table tbody tr {
        transition: background-color 0.2s ease;
    }

    .modern-table tbody tr:hover {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }

    .modern-table tbody tr:last-child td {
        border-bottom: none;
    }

    /* Row Number Styling */
    .row-number {
        width: 3rem;
        text-align: center;
        font-weight: 700;
        color: var(--navy-primary);
        background: linear-gradient(135deg, var(--cyan-accent) 0%, var(--gold-highlight) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* Score Badge */
    .score-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 3rem;
        padding: 0.5rem;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.9rem;
    }

    .score-excellent {
        background: var(--success-gradient);
        color: white;
    }

    .score-good {
        background: var(--warning-gradient);
        color: white;
    }

    .score-needs-improvement {
        background: var(--danger-gradient);
        color: white;
    }

    /* Status Indicators */
    .status-indicator {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .status-shared {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-pending {
        background: rgba(255, 184, 0, 0.1);
        color: var(--gold-highlight);
        border: 1px solid rgba(255, 184, 0, 0.2);
    }

    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
    }

    /* Modern Pagination */
    .modern-pagination {
        padding: 2rem;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        border-top: 1px solid var(--border-color);
    }

    .pagination .page-link {
        border: 2px solid var(--border-color);
        border-radius: 8px !important;
        margin: 0 2px;
        padding: 0.5rem 0.75rem;
        color: var(--text-primary);
        font-weight: 600;
        transition: var(--transition-smooth);
    }

    .pagination .page-link:hover {
        border-color: var(--cyan-accent);
        background: var(--cyan-accent);
        color: white;
        transform: translateY(-2px);
    }

    .pagination .page-item.active .page-link {
        background: var(--primary-gradient);
        border-color: var(--navy-primary);
        color: white;
    }

    .pagination .page-item.disabled .page-link {
        opacity: 0.5;
        background: #f8fafc;
        color: var(--text-secondary);
        border-color: var(--border-color);
    }

    /* Empty State */
    .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-secondary);
    }

    .empty-state i {
        font-size: 4rem;
        color: var(--cyan-accent);
        margin-bottom: 1rem;
        opacity: 0.5;
    }

    .empty-state h3 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
    }

    /* Modern Toast */
    .modern-toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        min-width: 320px;
        max-width: 480px;
        background: white;
        color: var(--text-primary);
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        border-left: 4px solid #10b981;
        display: none;
        z-index: 9999;
        backdrop-filter: blur(10px);
    }

    .modern-toast.error {
        border-left-color: var(--fire-red);
        background: #fef2f2;
        color: #dc2626;
    }

    .modern-toast.success {
        border-left-color: #10b981;
        background: #f0f9f4;
        color: #059669;
    }

    .modern-toast.show {
        display: block;
        animation: toastIn 0.5s cubic-bezier(0.4, 0, 0.2, 1), toastOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) 2.5s;
    }

    @keyframes toastIn {
        from {
            opacity: 0;
            transform: translateX(100%);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes toastOut {
        from {
            opacity: 1;
            transform: translateX(0);
        }
        to {
            opacity: 0;
            transform: translateX(100%);
        }
    }

    /* Action Buttons Group */
    .action-buttons {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .modern-page-header {
            padding: 1.5rem;
            text-align: center;
        }

        .modern-page-header h1 {
            font-size: 2rem;
            flex-direction: column;
            gap: 0.5rem;
        }

        .header-actions {
            position: static;
            margin-top: 1rem;
            text-align: center;
        }

        .controls-section {
            padding: 1.5rem;
        }

        .search-container {
            max-width: 100%;
        }

        .table-container {
            padding: 1rem;
        }

        .modern-table {
            font-size: 0.8rem;
        }

        .modern-table th,
        .modern-table td {
            padding: 0.75rem 0.5rem;
        }

        .action-buttons {
            flex-direction: column;
            gap: 0.25rem;
        }

        .modern-btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.7rem;
        }

        .modern-pagination {
            padding: 1.5rem;
            flex-wrap: wrap;
        }

        .modern-toast {
            bottom: 1rem;
            right: 1rem;
            left: 1rem;
            min-width: auto;
        }
    }

    /* Animation Enhancements */
    .fade-in {
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .stagger-animation > * {
        opacity: 0;
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .stagger-animation > *:nth-child(1) { animation-delay: 0.1s; }
    .stagger-animation > *:nth-child(2) { animation-delay: 0.2s; }
    .stagger-animation > *:nth-child(3) { animation-delay: 0.3s; }
</style>

<script>
    const baseUrl = '<?= baseUrl ?>';
    let allQA = [], currentPage = 1, rowsPerPage = 15;
    let callDateCache = new WeakMap();
    let callDateFormatter;

    try {
        callDateFormatter = new Intl.DateTimeFormat(undefined, {
            year: 'numeric',
            month: 'short',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
    } catch (err) {
        console.warn('Unable to initialize call date formatter:', err);
        callDateFormatter = null;
    }

    const PERCENTAGE_FIELDS = [
        'PercentageScore',
        'Percentage',
        'OverallPercentage',
        'TotalPercentage',
        'ScorePercentage',
        'Score Percent',
        'ScorePercent',
        'QA Score',
        'QA%',
        'QA %',
        'FinalScore',
        'Final Score',
        'OverallScore',
        'AgentPercentage',
        'Agent Score',
        'AgentScore',
        'QAScore'
    ];

    const SCORE_FIELDS = [
        'TotalScore',
        'Score',
        'Total Points',
        'TotalPoints',
        'TotalPointsEarned',
        'OverallScore',
        'QA Score',
        'QAScore'
    ];

    function showToast(msg, isError) {
        if (window.showLuminaToast) {
            window.showLuminaToast(msg, isError ? 'danger' : 'success');
            return;
        }

        const tone = isError ? 'ERROR' : 'SUCCESS';
        window.alert(`[${tone}] ${msg}`);
    }

    function loadQA() {
        google.script.run
            .withSuccessHandler(data => {
                allQA = data || [];
                callDateCache = new WeakMap();
                renderTable();
            })
            .withFailureHandler(err => showToast(err.message, true))
            .getAllQA();
    }

    function parseDateValue(value) {
        if ((!value && value !== 0) || value === 'Invalid Date') {
            return null;
        }
        if (value instanceof Date) {
            return new Date(value.getTime());
        }
        if (typeof value === 'number' && Number.isFinite(value)) {
            if (value > 1e12) {
                return new Date(value);
            }
            if (value > 1e9) {
                return new Date(value * 1000);
            }
            if (value > 0) {
                const epoch = (value - 25569) * 86400000;
                const asDate = new Date(epoch);
                if (!Number.isNaN(asDate.getTime())) {
                    return asDate;
                }
            }
            return null;
        }

        const str = String(value).trim();
        if (!str) {
            return null;
        }

        const isoCandidate = str.replace(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}(:\d{2})?)/, '$1T$2');
        let parsed = new Date(isoCandidate);
        if (!Number.isNaN(parsed.getTime())) {
            return parsed;
        }

        parsed = new Date(str);
        if (!Number.isNaN(parsed.getTime())) {
            return parsed;
        }

        const dateMatch = str.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
        if (dateMatch) {
            const month = Number(dateMatch[1]);
            const day = Number(dateMatch[2]);
            const yearRaw = dateMatch[3];
            const year = yearRaw.length === 2 ? Number(`20${yearRaw}`) : Number(yearRaw);
            if (!Number.isNaN(month) && !Number.isNaN(day) && !Number.isNaN(year)) {
                const alt = new Date(year, month - 1, day);
                if (!Number.isNaN(alt.getTime())) {
                    return alt;
                }
            }
        }

        return null;
    }

    function getCallDateInfo(record) {
        if (!record || typeof record !== 'object') {
            return { display: '', sortValue: 0 };
        }

        if (callDateCache.has(record)) {
            return callDateCache.get(record);
        }

        const candidates = [];
        const callDateValue = record.CallDate || record['Call Date'] || '';
        const callTimeValue = record.CallTime || record['Call Time'] || '';

        if (callDateValue && callTimeValue) {
            candidates.push(`${callDateValue} ${callTimeValue}`);
        }

        const candidateFields = [
            'CallDateTime',
            'Call Date Time',
            'Call datetime',
            'Call Datetime',
            'CallDate',
            'Call Date',
            'CallTimestamp',
            'Call Timestamp'
        ];

        candidateFields.forEach(field => {
            const value = record[field];
            if (value !== undefined && value !== null && value !== '') {
                candidates.push(value);
            }
        });

        let display = '';
        for (const candidate of candidates) {
            const parsed = parseDateValue(candidate);
            if (parsed) {
                const formatted = callDateFormatter ? callDateFormatter.format(parsed) : parsed.toLocaleString();
                const info = { display: formatted, sortValue: parsed.getTime() };
                callDateCache.set(record, info);
                return info;
            }

            if (!display && candidate) {
                display = String(candidate);
            }
        }

        const fallbackTimestamp = parseDateValue(record.Timestamp || record['Timestamp']);
        const info = {
            display: display || '',
            sortValue: fallbackTimestamp ? fallbackTimestamp.getTime() : 0
        };

        callDateCache.set(record, info);
        return info;
    }

    function formatNumericPercentage(num) {
        if (!Number.isFinite(num)) {
            return '';
        }

        const normalized = Math.abs(num) <= 1 ? num * 100 : num;
        const sign = normalized < 0 ? '-' : '';
        const absolute = Math.abs(normalized);
        const rounded = Math.round(absolute * 10) / 10;
        const text = Number.isInteger(rounded) ? rounded.toString() : rounded.toFixed(1);
        return `${sign}${text}%`;
    }

    function formatPercentageValue(value) {
        if (value === undefined || value === null) {
            return '';
        }

        if (typeof value === 'number') {
            return formatNumericPercentage(value);
        }

        const str = String(value).trim();
        if (!str) {
            return '';
        }

        if (str.includes('%')) {
            return str;
        }

        const numeric = Number(str.replace(/[^0-9.+-]/g, ''));
        if (Number.isFinite(numeric)) {
            return formatNumericPercentage(numeric);
        }

        return str;
    }

    function resolvePercentageText(record) {
        if (!record || typeof record !== 'object') {
            return '';
        }

        for (const field of PERCENTAGE_FIELDS) {
            const value = record[field];
            if (value === undefined || value === null || value === '') {
                continue;
            }

            const formatted = formatPercentageValue(value);
            if (formatted) {
                return formatted;
            }
        }

        return '';
    }

    function formatScoreValue(value) {
        if (value === undefined || value === null) {
            return '';
        }

        if (typeof value === 'number') {
            if (!Number.isFinite(value)) {
                return '';
            }
            return Number.isInteger(value) ? value.toString() : value.toFixed(2);
        }

        const str = String(value).trim();
        if (!str) {
            return '';
        }

        const numeric = Number(str);
        if (!Number.isNaN(numeric)) {
            return Number.isInteger(numeric) ? numeric.toString() : numeric.toFixed(2);
        }

        return str;
    }

    function resolveScoreText(record) {
        if (!record || typeof record !== 'object') {
            return '';
        }

        for (const field of SCORE_FIELDS) {
            const value = record[field];
            const formatted = formatScoreValue(value);
            if (formatted) {
                return formatted;
            }
        }

        return '';
    }

    function normalizePdfUrl(raw) {
        if (raw === undefined || raw === null) {
            return '';
        }

        const str = String(raw).trim();
        if (!str) {
            return '';
        }

        if (/^https?:\/\//i.test(str)) {
            return str;
        }

        if (/^[a-zA-Z0-9_-]{10,}$/.test(str)) {
            return `https://drive.google.com/file/d/${encodeURIComponent(str)}/view?usp=sharing`;
        }

        if (/\.pdf($|[?#])/i.test(str)) {
            return str;
        }

        return '';
    }

    function resolvePdfLink(record) {
        if (!record || typeof record !== 'object') {
            return { url: '', label: '' };
        }

        const keys = Object.keys(record);
        let urlCandidate = '';
        let idCandidate = '';
        let labelCandidate = '';

        for (const key of keys) {
            const value = record[key];
            if (value === undefined || value === null) {
                continue;
            }

            const normalizedKey = String(key || '').toLowerCase();
            const stringValue = typeof value === 'string' ? value.trim() : String(value).trim();
            if (!stringValue) {
                continue;
            }

            if (!labelCandidate && normalizedKey.includes('pdf') && normalizedKey.includes('name')) {
                labelCandidate = stringValue;
            }

            if (/^https?:\/\//i.test(stringValue) || /\.pdf($|[?#])/i.test(stringValue)) {
                if (!urlCandidate) {
                    urlCandidate = stringValue;
                }
                continue;
            }

            if (!urlCandidate && normalizedKey.includes('pdf') && (normalizedKey.includes('url') || normalizedKey.includes('link'))) {
                urlCandidate = stringValue;
                continue;
            }

            if (!idCandidate && normalizedKey.includes('pdf') && normalizedKey.includes('id')) {
                idCandidate = stringValue;
                continue;
            }

            if (!urlCandidate && normalizedKey.includes('report') && (normalizedKey.includes('url') || normalizedKey.includes('link'))) {
                urlCandidate = stringValue;
            }
        }

        if (!urlCandidate && idCandidate) {
            urlCandidate = idCandidate;
        }

        const url = normalizePdfUrl(urlCandidate);
        if (!url) {
            return { url: '', label: '' };
        }

        const label = labelCandidate || 'View PDF';
        return { url, label };
    }

    function getFirstValue(record, fields) {
        if (!record || typeof record !== 'object') {
            return '';
        }

        for (const field of fields) {
            const value = record[field];
            if (value === undefined || value === null) {
                continue;
            }

            const text = typeof value === 'string' ? value.trim() : String(value);
            if (text !== '') {
                return value;
            }
        }

        return '';
    }

    function toDisplayText(value) {
        if (value === undefined || value === null) {
            return '';
        }

        if (value instanceof Date) {
            return callDateFormatter ? callDateFormatter.format(value) : value.toLocaleString();
        }

        return typeof value === 'string' ? value : String(value);
    }

    function escapeHtml(value) {
        const str = value === undefined || value === null ? '' : String(value);
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function buildPageUrl(page, params = {}) {
        const rawBase = String(baseUrl || (typeof window !== 'undefined' ? window.location.href : '') || '');
        if (!rawBase) {
            return '#';
        }

        try {
            const url = new URL(rawBase, typeof window !== 'undefined' ? window.location.origin : undefined);
            if (page) {
                url.searchParams.set('page', page);
            }

            Object.keys(params || {}).forEach(key => {
                const value = params[key];
                if (value === undefined || value === null || value === '') {
                    url.searchParams.delete(key);
                } else {
                    url.searchParams.set(key, value);
                }
            });

            return url.toString();
        } catch (error) {
            console.warn('Unable to build page URL:', error);
            const query = new URLSearchParams();
            if (page) {
                query.set('page', page);
            }

            Object.keys(params || {}).forEach(key => {
                const value = params[key];
                if (value !== undefined && value !== null && value !== '') {
                    query.set(key, value);
                }
            });

            if (rawBase.indexOf('?') === -1) {
                const basePart = rawBase.replace(/[#?].*$/, '');
                const hashPart = rawBase.includes('#') ? rawBase.substring(rawBase.indexOf('#')) : '';
                return `${basePart}?${query.toString()}${hashPart}`;
            }

            const [basePart, rest] = rawBase.split('?');
            const hashIndex = rest.indexOf('#');
            const existingQuery = hashIndex >= 0 ? rest.substring(0, hashIndex) : rest;
            const hashPart = hashIndex >= 0 ? rest.substring(hashIndex) : '';
            const paramsObj = new URLSearchParams(existingQuery);

            paramsObj.set('page', page);
            Object.keys(params || {}).forEach(key => {
                const value = params[key];
                if (value === undefined || value === null || value === '') {
                    paramsObj.delete(key);
                } else {
                    paramsObj.set(key, value);
                }
            });

            return `${basePart}?${paramsObj.toString()}${hashPart}`;
        }
    }

    function renderTable() {
        const term = (document.getElementById('searchInput').value || '').toLowerCase();
        const filtered = allQA.filter(r => {
            const idText = (getFirstValue(r, ['ID', 'Id', 'id']) || '').toString().toLowerCase();
            const agentText = (getFirstValue(r, ['AgentName', 'Agent']) || '').toString().toLowerCase();
            const caseText = toDisplayText(getFirstValue(r, ['CaseNumber', 'Case Number', 'Case'])).toLowerCase();
            const callText = (getCallDateInfo(r).display || '').toLowerCase();
            return idText.includes(term) || agentText.includes(term) || caseText.includes(term) || callText.includes(term);
        });

        // ensure newest entries appear first by sorting descending by call date (fallback to ID)
        const sorted = filtered.slice().sort((a, b) => {
            const aInfo = getCallDateInfo(a);
            const bInfo = getCallDateInfo(b);
            const diff = (bInfo.sortValue || 0) - (aInfo.sortValue || 0);
            if (diff !== 0) {
                return diff;
            }

            const aId = (getFirstValue(a, ['ID', 'Id', 'id']) || '').toString();
            const bId = (getFirstValue(b, ['ID', 'Id', 'id']) || '').toString();
            if (aId && bId) {
                return bId.localeCompare(aId);
            }

            return 0;
        });

        // 1) pagination math
        const totalPages = Math.max(1, Math.ceil(sorted.length / rowsPerPage));
        currentPage = Math.min(currentPage, totalPages);
        const start = (currentPage - 1) * rowsPerPage;
        const pageItems = sorted.slice(start, start + rowsPerPage);

        // 2) render rows
        const tbody = document.querySelector('#qaTable tbody');
        if (!pageItems.length) {
            tbody.innerHTML = `<tr><td colspan="10" class="text-center">No records found.</td></tr>`;
        } else {
            tbody.innerHTML = pageItems.map((r, idx) => {
                const rowNo = start + idx + 1;
                const callInfo = getCallDateInfo(r);
                const callDateText = escapeHtml(callInfo.display || '—');
                const caseValue = getFirstValue(r, ['CaseNumber', 'Case Number', 'Case']);
                let caseCell = '—';
                if (caseValue) {
                    const caseString = toDisplayText(caseValue);
                    caseCell = /^https?:\/\//i.test(caseString)
                        ? `<a href="${caseString}" target="_blank" rel="noopener">View</a>`
                        : escapeHtml(caseString);
                }

                const scoreText = escapeHtml(resolveScoreText(r) || '—');
                const percentageText = escapeHtml(resolvePercentageText(r) || '—');
                const feedbackShared = escapeHtml(toDisplayText(getFirstValue(r, ['FeedbackShared', 'Feedback Shared', 'Feedback'])) || '—');
                const agentFeedback = escapeHtml(toDisplayText(getFirstValue(r, ['AgentFeedback', 'Agent Feedback', 'Agent Response'])) || '—');
                const agentName = escapeHtml(toDisplayText(getFirstValue(r, ['AgentName', 'Agent'])) || '—');
                const pdfInfo = resolvePdfLink(r);
                const pdfCell = pdfInfo.url
                    ? `<a href="${escapeHtml(pdfInfo.url)}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-secondary"><i class="fas fa-file-pdf me-1"></i>${escapeHtml(pdfInfo.label || 'View PDF')}</a>`
                    : '—';

                const recordIdValue = getFirstValue(r, ['ID', 'Id', 'id']);
                const recordId = recordIdValue === undefined || recordIdValue === null ? '' : String(recordIdValue);
                const viewUrl = recordId ? buildPageUrl('qaview', { id: recordId }) : '#';
                const editUrl = recordId ? buildPageUrl('qualityform', { id: recordId }) : '#';
                const deleteArg = JSON.stringify(recordId);

                const viewButton = recordId
                    ? `<a href="${viewUrl}" class="btn btn-sm btn-info me-1"><i class="fas fa-eye"></i> View</a>`
                    : `<button type="button" class="btn btn-sm btn-info me-1" disabled aria-disabled="true"><i class="fas fa-eye"></i> View</button>`;

                const editButton = recordId
                    ? `<a href="${editUrl}" class="btn btn-sm btn-primary me-1"><i class="fas fa-edit"></i> Edit</a>`
                    : `<button type="button" class="btn btn-sm btn-primary me-1" disabled aria-disabled="true"><i class="fas fa-edit"></i> Edit</button>`;

                const deleteButton = recordId
                    ? `<button class="btn btn-sm btn-danger" onclick="deleteRecord(${deleteArg})"><i class="fas fa-trash"></i></button>`
                    : `<button type="button" class="btn btn-sm btn-danger" disabled aria-disabled="true"><i class="fas fa-trash"></i></button>`;

                return `
                    <tr>
                        <td class="text-center">${rowNo}</td>
                        <td>${callDateText}</td>
                        <td>${agentName}</td>
                        <td>${caseCell}</td>
                        <td>${scoreText}</td>
                        <td>${percentageText}</td>
                        <td>${feedbackShared}</td>
                        <td>${agentFeedback}</td>
                        <td>${pdfCell}</td>
                        <td>${viewButton}${editButton}${deleteButton}</td>
                    </tr>`;
            }).join('');
        }

        // 3) render pagination
        renderPagination(totalPages);

        // 4) hide loader if present
        const loader = document.getElementById('pageLoader');
        if (loader) loader.style.display = 'none';
    }

    function renderPagination(totalPages) {
        const pagUl = document.getElementById('pagination');
        if (totalPages < 2) {
            pagUl.innerHTML = '';
            return;
        }
        let html = `
            <li class="page-item ${currentPage===1?'disabled':''}">
                <button type="button" class="page-link" onclick="changePage(${currentPage-1})">
                    Prev
                </button>
            </li>`;
        for (let p = 1; p <= totalPages; p++) {
            html += `
            <li class="page-item ${p===currentPage?'active':''}">
                <button type="button" class="page-link" onclick="changePage(${p})">
                    ${p}
                </button>
            </li>`;
        }
        html += `
            <li class="page-item ${currentPage===totalPages?'disabled':''}">
                <button type="button" class="page-link" onclick="changePage(${currentPage+1})">
                    Next
                </button>
            </li>`;
        pagUl.innerHTML = html;
    }

    function changePage(p) {
        // ensure within bounds
        const term = (document.getElementById('searchInput').value || '').toLowerCase();
        const filteredLen = allQA.filter(r => {
            const idText = (getFirstValue(r, ['ID', 'Id', 'id']) || '').toString().toLowerCase();
            const agentText = (getFirstValue(r, ['AgentName', 'Agent']) || '').toString().toLowerCase();
            const caseText = toDisplayText(getFirstValue(r, ['CaseNumber', 'Case Number', 'Case'])).toLowerCase();
            const callText = (getCallDateInfo(r).display || '').toLowerCase();
            return idText.includes(term) || agentText.includes(term) || caseText.includes(term) || callText.includes(term);
        }).length;
        const totalPages = Math.max(1, Math.ceil(filteredLen / rowsPerPage));
        if (p < 1 || p > totalPages) return;
        currentPage = p;
        renderTable();
    }

    function deleteRecord(id) {
        const recordId = typeof id === 'string' ? id : (id === undefined || id === null ? '' : String(id));
        if (!recordId) {
            showToast('Record ID missing. Unable to delete.', true);
            return;
        }

        if (!confirm('Delete this QA record?')) return;
        google.script.run
            .withSuccessHandler(() => { showToast('Deleted', false); loadQA(); })
            .withFailureHandler(err => showToast(err.message, true))
            .deleteQARecord(recordId);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadQA();
        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1;
            renderTable();
        });
    });
</script>
